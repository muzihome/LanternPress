name: Mirror-to-Gitee

on:
  push:
  delete:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install git-filter-repo
        run: |
          python3 -m pip install git-filter-repo

      - name: Setup SSH for Gitee
        env:
          GITEE_PRIVATE_KEY: ${{ secrets.GITEE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "${GITEE_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan gitee.com >> ~/.ssh/known_hosts
          git config --global user.name "Mirror-Bot"
          git config --global user.email "mirror@no-reply.local"

      - name: Create temp clone & remove .github from whole history
        run: |
          git clone --no-local . ./filter_work
          cd ./filter_work
          git filter-repo --path .github --invert-paths --force
          git remote remove gitee || true
          git remote add gitee git@gitee.com:muzinext/LanternPress.git
          cd ..

      - name: Push filtered branches to Gitee (skip if Gitee ahead)
        run: |
          cd ./filter_work
          git fetch gitee --prune '+refs/heads/*:refs/remotes/gitee/*' '+refs/tags/*:refs/remotes/gitee/tags/*' || true
          for br in $(git for-each-ref --format='%(refname:short)' refs/heads); do
            # 若 Gitee 同分支领先或分叉（本地历史未包含其 HEAD），跳过强制推送，避免覆盖私库提交
            if git rev-parse --verify -q "refs/remotes/gitee/${br}" >/dev/null 2>&1; then
              if ! git merge-base --is-ancestor "refs/remotes/gitee/${br}" "$br" 2>/dev/null; then
                echo "SKIP ${br}: gitee/${br} ahead or diverged, force push aborted"
                continue
              fi
            fi
            git push gitee "${br}:refs/heads/${br}" --force
          done

      - name: Push original tags (skip if Gitee tag ahead or diverged)
        run: |
          cd ./filter_work
          for tg in $(git for-each-ref --format='%(refname:short)' refs/tags); do
            # 与分支同理：Gitee 同名标签领先或分叉（本地历史未包含其目标提交）时跳过，避免覆盖私库标签
            if git rev-parse --verify -q "refs/remotes/gitee/tags/${tg}" >/dev/null 2>&1; then
              if ! git merge-base --is-ancestor "refs/remotes/gitee/tags/${tg}" "${tg}" 2>/dev/null; then
                echo "SKIP TAG ${tg}: gitee/tags/${tg} ahead or diverged, force push aborted"
                continue
              fi
            fi
            git push gitee "refs/tags/${tg}:refs/tags/${tg}" --force
          done

      - name: Prune branches deleted on GitHub
        run: |
          cd ./filter_work
          LOCAL_BRANCHES=$(git for-each-ref --format='%(refname:short)' refs/heads)
          GITEE_BRANCHES=$(git ls-remote --heads gitee | awk '{print $2}' | sed 's/refs\/heads\///')
          for br in $GITEE_BRANCHES; do
            if ! echo "$LOCAL_BRANCHES" | grep -q "^${br}$"; then
              git push gitee :${br} || true
            fi
          done

      - name: Clean temporary directory
        run: rm -rf ./filter_work
