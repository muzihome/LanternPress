name: Mirror-to-Gitee
on:
  push:
  delete:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install git-filter-repo
        run: |
          python3 -m pip install git-filter-repo

      # git-filter-repo 强制要求已配置 user.name/user.email，否则直接报错
      - name: Configure git identity
        run: |
          git config --global user.name "Mirror-Bot"
          git config --global user.email "mirror@no-reply.local"

      - name: Create temp clone & remove .github from whole history
        run: |
          git clone --no-local . ./filter_work
          cd ./filter_work
          git filter-repo --path .github --invert-paths --force
          cd ..

      # 海外 runner 直连 Gitee SSH:22 会被防火墙重置，改用 HTTPS + 私人令牌（GITEE_TOKEN）
      - name: Push filtered branches to Gitee (HTTPS)
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          cd ./filter_work
          git remote remove gitee || true
          git remote add gitee https://muzinext:${GITEE_TOKEN}@gitee.com/muzinext/LanternPress.git
          git push gitee refs/heads/*:refs/heads/* --force

      - name: Push original tags (tags cannot filter files)
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          cd ./filter_work
          git push gitee refs/tags/*:refs/tags/* --force

      - name: Prune branches deleted on GitHub
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          cd ./filter_work
          LOCAL_BRANCHES=$(git for-each-ref --format='%(refname:short)' refs/heads)
          GITEE_BRANCHES=$(git ls-remote --heads gitee | awk '{print $2}' | sed 's/refs\/heads\///')
          for br in $GITEE_BRANCHES; do
            if ! echo "$LOCAL_BRANCHES" | grep -q "^${br}$"; then
              git push gitee :${br} || true
            fi
          done

      - name: Clean temporary directory
        run: rm -rf ./filter_work
